site_name: FluxSend Docs
site_description: Public product and API documentation for FluxSend
site_dir: site
docs_dir: docs-site
copyright: FluxSend — self-hostable file transfer

theme:
  name: material
  language: en
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  # We load the FluxSend typeface (Datatype) ourselves in overrides/main.html,
  # so disable Material's bundled Roboto/Inter stack.
  font: false
  custom_dir: overrides
  palette:
    # Dark is the default so the docs match the FluxSend app.
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - announce.dismiss

nav:
  - Home: index.md
  - Introduction:
      - What is FluxSend?: introduction/01-what-is-fluxsend.md
      - Key features: introduction/02-key-features.md
      - Use cases: introduction/03-use-cases.md
      - Tech stack: introduction/04-tech-stack.md
  - Quick Start:
      - Prerequisites: quickstart/01-prerequisites.md
      - Installing tools: quickstart/02-installing-tools.md
  - Configuration Reference:
      - Configuration loading: config-reference/00-config-loading.md
      - Environment variables: config-reference/01-env-vars.md
      - Storage: config-reference/02-storage.md
      - Authentication: config-reference/03-auth.md
      - Database: config-reference/04-db.md
      - CDN: config-reference/05-cdn.md
      - SMTP: config-reference/06-smtp.md
  # - Usage:
  #     - File Management: usage/01-file-management.md
  #     - Sharing & Downloads: usage/02-sharing.md
  #     - Workspaces: usage/03-workspaces.md
  #     - API Keys: usage/04-api-keys.md
  #     - Plans & Quotas: usage/05-plans.md
  - Deployment:
      - Production Checklist: deployment/00-production-checklist.md
      - Production Setup: deployment/01-production-setup.md
      - Standalone: deployment/02-standalone.md
      - Docker: deployment/03-docker.md
      - Metrics: deployment/06-metrics.md
      - Self-hosted MinIO: deployment/05-self-hosted-minio.md
      - Kubernetes: deployment/04-kubernetes.md
  - API Reference:
      - Overview: api/index.md
      - Endpoint Reference: api/reference.md
plugins:
  - search
  - macros:
      module_name: docs-site/main

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - styles/extra.css

extra_javascript:
  - javascripts/interactions.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tscrond/fluxsend
      name: FluxSend on GitHub
