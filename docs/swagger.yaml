  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: fluxsend.app
info:
  contact:
    name: tscrond
    url: https://github.com/tscrond
  description: Fluxsend API endpoints
  license:
    name: MIT
    url: https://mit-license.org/
  title: FluxSend Developer API
  version: 1.7.0
paths:
  /api/api_keys/{workspace_id}/create:
    post:
      consumes:
      - application/json
      description: Creates a workspace-scoped API key for users allowed to manage
        workspace API keys.
      parameters:
      - description: Workspace ID
        in: path
        name: workspace_id
        required: true
        type: string
      - description: API key create request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse-api_APIKeyCreatedResponseData'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Create workspace API key
      tags:
      - API Keys
  /api/api_keys/{workspace_id}/delete:
    delete:
      consumes:
      - application/json
      description: Deletes a workspace-scoped API key by ID.
      parameters:
      - description: Workspace ID
        in: path
        name: workspace_id
        required: true
