basePath: /
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: fluxsend.win
info:
  contact:
    name: tscrond
    url: https://github.com/tscrond
  description: Fluxsend API endpoints
  license:
    name: MIT
    url: https://mit-license.org/
  title: FluxSend Developer API
  version: 1.7.0
paths:
  /api/api_keys/{workspace_id}/create:
    post:
      consumes:
      - application/json
      description: Creates a workspace-scoped API key for users allowed to manage
        workspace API keys.
      parameters:
      - description: Workspace ID
        in: path
        name: workspace_id
        required: true
        type: string
      - description: API key create request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
      summary: Create workspace API key
      tags:
      - API Keys
  /api/api_keys/{workspace_id}/delete:
    delete:
      consumes:
      - application/json
      description: Deletes a workspace-scoped API key by ID.
      parameters:
      - description: Workspace ID
        in: path
        name: workspace_id
        required: true
        type: string
      - description: Delete API key request
        in: body
        name: request
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Delete workspace API key
      tags:
      - API Keys
  /api/api_keys/{workspace_id}/list:
    get:
      description: Returns the API keys created for the selected workspace.
      parameters:
      - description: Workspace ID
        in: path
        name: workspace_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      summary: List workspace API keys
      tags:
      - API Keys
  /api/api_keys/private/create:
    post:
      consumes:
      - application/json
      description: Creates a private API key for the current user.
      parameters:
      - description: API key create request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
      summary: Create private API key
      tags:
      - API Keys
  /api/api_keys/private/delete:
    delete:
      consumes:
      - application/json
      description: Deletes a private API key owned by the authenticated user.
      parameters:
      - description: Delete API key request
        in: body
        name: request
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Delete private API key
      tags:
      - API Keys
  /api/api_keys/private/list:
    get:
      description: Returns all private API keys created by the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: List private API keys
      tags:
      - API Keys
  /api/d/{token}:
    get:
      description: Resolves a public share token and either redirects or proxies the
        file content.
      parameters:
      - description: Share token
        in: path
        name: token
        required: true
        type: string
      - description: inline or download
        in: query
        name: mode
        type: string
      responses:
        "302":
          description: Redirect to the signed URL
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Download public share
      tags:
      - Downloads
  /api/d/private/{token}:
    get:
      description: Resolves a private download token for the authenticated file owner
        and redirects to the download URL.
      parameters:
      - description: Download token
        in: path
        name: token
        required: true
        type: string
      - description: inline or download
        in: query
        name: mode
        type: string
      responses:
        "302":
          description: Redirect to the signed URL
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Download private file
      tags:
      - Downloads
  /api/files/{checksum}/note:
    get:
      description: Returns the note content for a file checksum.
      parameters:
      - description: File checksum
        in: path
        name: checksum
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Get file note
      tags:
      - Files
    put:
      consumes:
      - application/json
      description: Updates or creates the note for a file checksum.
      parameters:
      - description: File checksum
        in: path
        name: checksum
        required: true
        type: string
      - description: Note content request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Edit file note
      tags:
      - Files
  /api/files/delete:
    delete:
      description: Deletes a file from the authenticated user's personal storage.
      parameters:
      - description: File path
        in: query
        name: file
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Delete a file
      tags:
      - Files
  /api/files/delete/batch:
    delete:
      consumes:
      - application/json
      description: Deletes several personal files in one request.
      parameters:
      - description: Files to delete
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Delete multiple files
      tags:
      - Files
  /api/files/move:
    post:
      consumes:
      - application/json
      description: Moves a personal file from one path to another.
      parameters:
      - description: Move request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Move file
      tags:
      - Files
  /api/files/quick_share:
    post:
      consumes:
      - application/json
      description: Creates a public share token for a personal file.
      parameters:
      - description: Quick share request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Create quick share
      tags:
      - Sharing
  /api/files/received:
    get:
      description: Returns all files shared with the current user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: List received shares
      tags:
      - Sharing
  /api/files/received/mark_seen:
    post:
      consumes:
      - application/json
      description: Marks a received share as seen by token.
      parameters:
      - description: Mark seen request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Mark received share as seen
      tags:
      - Sharing
  /api/files/received/unseen_count:
    get:
      description: Returns how many received shares have not yet been marked as seen.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Count unseen received files
      tags:
      - Sharing
  /api/files/share:
    post:
      consumes:
      - application/json
      description: Shares one or more personal files with another user, optionally
        emailing the recipient.
      parameters:
      - description: Share request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
      summary: Share files
      tags:
      - Sharing
  /api/files/shared_by_user:
    get:
      description: Returns all files that the current user has shared with others.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: List outgoing shares
      tags:
      - Sharing
  /api/files/tree:
    get:
      description: Returns the authenticated user's personal file tree for a given
        path prefix.
      parameters:
      - description: Path prefix
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Get file tree
      tags:
      - Files
  /api/files/upload:
    post:
      consumes:
      - multipart/form-data
      description: Uploads a file to the current user's personal storage and optionally
        stores it in a folder.
      parameters:
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      - description: Destination folder
        in: formData
        name: folder
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Upload a file
      tags:
      - Files
  /api/folders:
    delete:
      description: Deletes a personal folder and optionally all nested files and folders
        when recursive is true.
      parameters:
      - description: Folder path
        in: query
        name: path
        required: true
        type: string
      - description: Delete recursively
        in: query
        name: recursive
        type: boolean
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Delete folder
      tags:
      - Files
    get:
      description: Returns the folders that exist at the supplied personal path.
      parameters:
      - description: Path prefix
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: List folders
      tags:
      - Files
  /api/folders/move:
    post:
      consumes:
      - application/json
      description: Moves a personal folder to another path.
      parameters:
      - description: Move request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Move folder
      tags:
      - Files
  /api/share/info/{token}:
    get:
      description: Returns public metadata for a share token without requiring authentication.
      parameters:
      - description: Share token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get public share info
      tags:
      - Sharing
  /api/share/resolve/{token}:
    post:
      consumes:
      - application/json
      description: Resolves a public share token and returns a signed download URL.
      parameters:
      - description: Share token
        in: path
        name: token
        required: true
        type: string
      - description: inline or download
        in: query
        name: mode
        type: string
      - description: Optional password payload
        in: body
        name: request
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Resolve public share
      tags:
      - Sharing
  /api/share/revoke/{token}:
    post:
      description: Revokes a previously created public share token.
      parameters:
      - description: Share token
        in: path
        name: token
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Revoke share
      tags:
      - Sharing
  /api/user/account/delete:
    delete:
      consumes:
      - application/json
      description: Deletes the authenticated user's account and optionally keeps or
        removes bucket data.
      parameters:
      - description: Delete account request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Delete account
      tags:
      - User
  /api/user/bucket:
    get:
      description: Returns the current user's bucket metadata and usage details.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Get user bucket data
      tags:
      - User
  /api/user/data:
    get:
      description: Returns the authenticated user's profile and plan details.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Get current user data
      tags:
      - User
  /api/user/private/download_token:
    post:
      description: Generates a download token for a private file name.
      parameters:
      - description: File name
        in: query
        name: file
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Create private download token
      tags:
      - User
  /api/user/stats:
    get:
      description: Returns aggregate file, share, and workspace statistics for the
        current user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Get user statistics
      tags:
      - User
  /api/workspaces/{workspace_id}/files/delete:
    delete:
      description: Deletes a workspace file when the caller has write access.
      parameters:
      - description: Workspace ID
        in: path
        name: workspace_id
        required: true
        type: string
      - description: File ID
        in: query
        name: file_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Delete workspace file
      tags:
      - Workspace Files
  /api/workspaces/{workspace_id}/files/download:
    get:
      description: Creates a signed download URL for a workspace file and redirects
        or proxies based on mode.
      parameters:
      - description: Workspace ID
        in: path
        name: workspace_id
        required: true
        type: string
      - description: File ID
        in: query
        name: file_id
        required: true
        type: string
      - description: inline or download
        in: query
        name: mode
        type: string
      responses:
        "302":
          description: Redirect to the signed URL
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Download workspace file
      tags:
      - Workspace Files
  /api/workspaces/{workspace_id}/files/folder/delete:
    delete:
      description: Deletes a workspace folder when the caller has write access.
      parameters:
      - description: Workspace ID
        in: path
        name: workspace_id
        required: true
        type: string
      - description: Folder path
        in: query
        name: path
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Delete workspace folder
      tags:
      - Workspace Files
  /api/workspaces/{workspace_id}/files/folder/move:
    patch:
      consumes:
      - application/json
      description: Moves a folder to a new location inside the workspace.
      parameters:
      - description: Workspace ID
        in: path
        name: workspace_id
        required: true
        type: string
      - description: Move request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
