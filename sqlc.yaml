version: "2"
sql:
  - engine: "postgresql"
    schema: "./internal/repo/migrations/"
    queries: "./internal/repo/query/"
    gen:
        go: 
            package: "sqlc"
            emit_json_tags: true
            out: "./internal/repo/sqlc"
            overrides:
              - db_type: "uuid"
                go_type:
                  import: "github.com/google/uuid"
                  type: "UUID"
                nullable: false
              - db_type: "uuid"
                go_type:
                  import: "github.com/google/uuid"
                  type: "NullUUID"
                nullable: true
