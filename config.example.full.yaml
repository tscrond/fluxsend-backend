# Full example config for FluxSend.
# Self-hosted MinIO + password-only auth is the most straightforward production setup.

app:
  env: production

api:
  listen_port: "3000"
  enable_google_auth: false
  enable_github_auth: false
  enable_password_auth: true
  google_client_id: "your-google-client-id"
  google_client_secret: "your-google-client-secret"
  github_client_id: "your-github-oauth-client-id"
  github_client_secret: "your-github-oauth-client-secret"
  token_encryption_key: "replace-with-strong-random-secret"
  frontend_endpoint: "http://localhost:8000"
  backend_endpoint: "http://localhost:3000"
  mail_from: "noreply@example.com"

  db:
    host: "localhost"
    user: "fluxsend"
    password: "change-me"
    name: "fluxsend"

  # Recommended self-hosted path: minio
  storage_provider: "minio"

  # Optional AWS values if you use AWS S3 instead of MinIO
  aws_region: "eu-north-1"
  aws_access_key_id: "your-aws-access-key-id"
  aws_secret_access_key: "your-aws-secret-access-key"

  cloudfront:
    enable_downloads: false
    domain: "d111111abcdef8.cloudfront.net"
    key_pair_id: "K1234567890ABC"
    private_key_path: "/abs/path/to/cloudfront-private-key.pem"

storage:
  # Self-hosted MinIO settings
  minio_bucket_name: "fluxsend"
  minio_endpoint: "http://localhost:9000"
  minio_access_key: "fluxsend"
  minio_secret_key: "change-me"
  minio_use_ssl: false
  # Optional: public HTTPS endpoint for direct downloads (e.g. https://s3.example.com).
  # Leave empty to stream downloads through the backend and keep MinIO private.
  minio_public_endpoint: ""
  minio_region: "us-east-1"

  # GCS settings (alternative)
  gcs_bucket_name: "fluxsend-dev"
  google_application_credentials: "/abs/path/to/gcp-service-account.json"
  google_project_id: "your-gcp-project-id"

  # S3 settings (alternative)
  s3_bucket_name: "fluxsend-dev"
  aws_region: "eu-north-1"

mail:
  provider: "standard"
  aws_region: "us-east-1"
  aws_access_key_id: "your-aws-access-key-id"
  aws_secret_access_key: "your-aws-secret-access-key"

  smtp_host: "smtp.mailgun.org"
  smtp_port: "587"
  smtp_username: "postmaster@example.com"
  smtp_password: "smtp-password"

cli:
  listen_port: "8091"
  backend_endpoint: "http://localhost:3000"
  route_prefix: "/api"

metrics:
  enabled: false
  listen_port: "9464"
  # Leave blank to bind all interfaces. Prefer 127.0.0.1 or a private address
  # unless your Prometheus server scrapes over an isolated network.
  bind_address: "127.0.0.1"
  path: "/metrics"
