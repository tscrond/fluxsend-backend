name: Image manual build and push
on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment'
        required: true
        default: 'test'
      tag:
        description: 'Tag for the image'
        required: true
        default: 'latest'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (DockerHub)
        id: meta-dockerhub
        uses: docker/metadata-action@v5
        with:
          images: bobaklabs/fluxsend-backend

      - name: Build and push Docker image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'pull_request' }}
          tags: bobaklabs/fluxsend-backend:${{ github.event.inputs.env }}-${{ github.event.inputs.tag }}
          platforms: linux/amd64
          cache-from: type=registry,ref=docker.io/bobaklabs/fluxsend-backend:cache
          cache-to: type=registry,ref=docker.io/bobaklabs/fluxsend-backend:cache,mode=max