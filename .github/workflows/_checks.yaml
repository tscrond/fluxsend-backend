name: Checks

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          go-version-file: 'go.mod'
          token: ${{ github.token }}
          cache-dependency-path: 'go.sum'
          architecture: 'x64'
      - name: Format Code
        run: |
          result="$(go fmt ./...)"
          if [[ $result != "" ]]; then
            echo 'go fmt check failed'
            echo $result
            exit 1
          fi
      - name: Run tests
        run: go test -cover -race -count=1 ./...
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
           go-version-input: 1.26.5
           go-package: ./...
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install MkDocs tooling
        run: pip install -r requirements.txt
      - name: Generate docs artifacts
        run: make swagger
      - name: Build docs site
        run: python3 -m mkdocs build --config-file mkdocs.yml
      - name: Verify generated docs are committed
        run: git diff --exit-code -- docs/swagger.json docs/swagger.yaml docs/docs.go docs-site/api/openapi.json docs-site/api/openapi.yaml docs-site/api/reference.md